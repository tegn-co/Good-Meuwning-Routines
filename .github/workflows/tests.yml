# Shared test job: used by ci.yml (push/PR) and release.yml (before building a release)
name: Run tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            xvfb dbus-x11 libnotify-bin
          mkdir -p ~/.local/share/fonts && cp packaging/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f

      - name: Unit and app tests
        run: xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session -- python3 -m unittest discover -s tests -t . -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo

      - name: Unit and app tests on Windows
        run: python -m unittest discover -s tests -t . -v
